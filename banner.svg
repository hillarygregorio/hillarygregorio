<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#6B4226"/>
    </linearGradient>
    <g id="sunflower">
      <g fill="#F4C430">
        <ellipse cx="0" cy="-22" rx="7" ry="16"/>
        <ellipse cx="0" cy="-22" rx="7" ry="16" transform="rotate(45)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="16" transform="rotate(90)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="16" transform="rotate(135)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="16" transform="rotate(180)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="16" transform="rotate(225)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="16" transform="rotate(270)"/>
        <ellipse cx="0" cy="-22" rx="7" ry="16" transform="rotate(315)"/>
      </g>
      <circle cx="0" cy="0" r="11" fill="#6B4226"/>
      <circle cx="0" cy="0" r="11" fill="none" stroke="#3E2723" stroke-width="1"/>
    </g>
  </defs>

  <rect width="900" height="240" fill="url(#bg)"/>

  <!-- decorative sunflowers, corners -->
  <use href="#sunflower" transform="translate(60,200) scale(1.3)"/>
  <use href="#sunflower" transform="translate(110,215) scale(0.8)"/>
  <use href="#sunflower" transform="translate(30,150) scale(0.7)"/>
  <use href="#sunflower" transform="translate(840,200) scale(1.3)"/>
  <use href="#sunflower" transform="translate(790,215) scale(0.8)"/>
  <use href="#sunflower" transform="translate(865,150) scale(0.7)"/>
  <use href="#sunflower" transform="translate(450,222) scale(0.55)" opacity="0.7"/>

  <!-- stems -->
  <path d="M60,200 Q55,225 60,238" stroke="#4B7B3A" stroke-width="3" fill="none"/>
  <path d="M840,200 Q845,225 840,238" stroke="#4B7B3A" stroke-width="3" fill="none"/>

  <!-- title -->
  <text x="450" y="105" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#F4C430" font-weight="bold">Oiee, eu sou a Hillary</text>

  <!-- subtitle -->
  <text x="450" y="145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#E8D9C5">Estudante de Ciência e Tecnologia na UFABC · Dados &amp; Analytics</text>

  <!-- divider -->
  <line x1="300" y1="165" x2="600" y2="165" stroke="#F4C430" stroke-width="1.5"/>
</svg>
